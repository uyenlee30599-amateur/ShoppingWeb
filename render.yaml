services:
  - type: web
    name: boutique-assignment03
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build:hosted
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: SESSION_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SMTP_HOST
        value: smtp.sendgrid.net
      - key: SMTP_PORT
        value: "2525"
      - key: SMTP_USER
        value: apikey
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: IMAGE_STORAGE
        value: cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
